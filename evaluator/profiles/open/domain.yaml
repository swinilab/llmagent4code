# What the open profile needs to know about the domain under evaluation.
#
# The open prompt (prompts/latest.md) is a template: swapping the Domain Model,
# the Field Constraint Table and the Behavior Workflow retargets it at another
# business domain without touching the NFR, ADR or verification sections. This
# file is the evaluator's half of that contract -- retargeting the prompt means
# rewriting this file, and nothing else in profiles/open/.
#
# The constraint table below must be transcribed from the prompt's Field
# Constraint Table, not from the generated application. If the two ever
# disagree, the prompt wins and this file is the defect: scoring an agent
# against a constraint it was never given produces a number that means nothing.

domain: order-management

# NFRs the prompt lists, in its own wording. Matching is on the numeric
# identifier, so 'NFR 2.1 Timeout' and 'nfr-2.1' both resolve.
nfrs:
  - "NFR 1.1 Limit Event Response"
  - "NFR 1.2 Maintain Multiple copies of Data"
  - "NFR 2.1 Timeout"
  - "NFR 2.2 Graceful Degradation"
  - "NFR 2.3 Retry"
  - "NFR 2.4 Transactions"

# Entity keys create_apis.json must declare -- lowercase singular, one per
# entity in the Domain Model.
entities: [customer, product, order, payment, invoice]

# State-changing steps in the Behavior Workflow that are not entity creation.
# Only the count is enforced: the prompt lets the agent name the steps, so
# checking names against a list would score vocabulary rather than coverage.
minimum_workflow_steps: 4

# ── constraint table ──────────────────────────────────────────────────────
# Consumed by common/bva.py to generate the mechanical probes: length and
# decimal boundaries, blank/missing/null, enum allow-lists, read-only
# rejection. Cases needing interpretation live in cases_interpretive.py -- a
# generator cannot derive from `^[\p{L}...]$` that a Vietnamese name must be
# accepted, nor from a currency range that GBP must not be.

valid_bodies:
  customer:
    name: "Nguyen Van An"
    address: "123 Nguyen Trai, Thanh Xuan, Hanoi"
    phone: "+84912345678"
    bankingDetails: {accountNumber: "1234567890", bankName: "Vietcombank"}
    role: "CUSTOMER"
  product:
    description: "Standard evaluation product"
    price: {amount: "19.99", currency: "USD"}

constraints:
  customer:
    name:
      required: true
      length: [2, 100]
      filler: "A"
    address:
      required: true
      length: [5, 255]
    bankingDetails.accountNumber:
      required: true
      length: [6, 20]
      filler: "1"
    bankingDetails.bankName:
      required: true
      length: [2, 100]
      filler: "A"
    role:
      required: true
      enum: [CUSTOMER, ORDER_STAFF, ACCOUNTANT]
    orderHistory:
      readOnly: true
      sample: ["3fa85f64-5717-4562-b3fc-2c963f66afa6"]

  product:
    description:
      required: true
      length: [3, 500]
    price.amount:
      required: true
      decimal: ["0.01", "999999.99"]
      places: 2
    price.currency:
      required: true
      enum: [USD, VND, EUR]
