services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orderman
      POSTGRES_PASSWORD: orderman
      POSTGRES_DB: orderman
    ports:
      # Published so the evaluator can observe PostgreSQL directly, without
      # going through the proxy it disables during the outage scenario.
      #
      # Host ports are offset by 10000 throughout this file so the reference
      # stack can run alongside an application under evaluation, which occupies
      # the standard ports. Only the host side is shifted: inside the network
      # the services still speak on their normal ports, so the deployment
      # contract the specification fixes is unchanged.
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderman"]
      interval: 2s
      timeout: 3s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "18474:8474"
      - "18666:8666"
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes:
      - ./toxiproxy:/config:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      APP_PORT: 8080
      MAX_IN_FLIGHT_REQUESTS: 10
      DB_OPERATION_TIMEOUT_MS: 1000
      DB_MAX_ATTEMPTS: 3
      DB_RETRY_BACKOFF_MS: 100
      CACHE_TTL_SECONDS: 5
      ENABLE_TEST_HOOKS: "true"
      # All database traffic goes through the proxy, never to db:5432 -- the
      # injected faults would otherwise miss the application entirely.
      DATABASE_URL: postgresql+psycopg://orderman:orderman@toxiproxy:8666/orderman
      # Calibration switches, off unless a deliberate-defect run sets them.
      DEFECT_NO_SINGLE_FLIGHT: "${DEFECT_NO_SINGLE_FLIGHT:-false}"
      DEFECT_QUEUE_INSTEAD_OF_REJECT: "${DEFECT_QUEUE_INSTEAD_OF_REJECT:-false}"
      DEFECT_METRICS_NEED_DB: "${DEFECT_METRICS_NEED_DB:-false}"
      DEFECT_PARTIAL_COMMIT: "${DEFECT_PARTIAL_COMMIT:-false}"
      DEFECT_NO_DEGRADED_CACHE: "${DEFECT_NO_DEGRADED_CACHE:-false}"
      DEFECT_WRONG_ERROR_CODE: "${DEFECT_WRONG_ERROR_CODE:-false}"
    ports:
      - "18080:8080"
    cpus: 2.0
    mem_limit: 2g
    depends_on:
      toxiproxy:
        condition: service_started
      db:
        condition: service_healthy
