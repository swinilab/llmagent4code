version: '3.8'

services:
  oms:
    build:
      context: ..
      dockerfile: iac/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/oms.db
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_QUEUE_SIZE=1000
      - WORKER_COUNT=4
    volumes:
      - oms-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  oms-data:
    driver: local
