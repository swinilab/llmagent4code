version: "3.9"

services:
  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-backend
    ports:
      - "8000:8000"
    environment:
      OMS_DATABASE_URL: "sqlite+aiosqlite:///data/oms.db"
      OMS_HOST: "0.0.0.0"
      OMS_PORT: "8000"
      OMS_DATABASE_POOL_SIZE: "10"
      OMS_DATABASE_MAX_OVERFLOW: "20"
      OMS_QUEUE_MAX_SIZE: "1000"
      OMS_QUEUE_WORKER_COUNT: "4"
      OMS_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
      OMS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "30.0"
      OMS_DEGRADATION_MEMORY_THRESHOLD_MB: "512"
      OMS_DEGRADATION_CPU_THRESHOLD_PERCENT: "90.0"
      OMS_REQUEST_TIMEOUT_SECONDS: "30"
    volumes:
      - oms_data:/app/data
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

volumes:
  oms_data:
