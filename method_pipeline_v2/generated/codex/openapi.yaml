  /:
    get:
      tags:
      - system
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
components:
  schemas:
    BankingDetails:
      properties:
        accountNumber:
          type: string
          maxLength: 20
          minLength: 6
          pattern: ^\d{6,20}$
          title: Accountnumber
        bankName:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[\p{L}0-9 .&-]+$
          title: Bankname
      additionalProperties: false
      type: object
      required:
      - accountNumber
      - bankName
      title: BankingDetails
    BillingInfo:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[\p{L} .'-]+$
          title: Name
        address:
          type: string
          maxLength: 255
          minLength: 5
          title: Address
      additionalProperties: false
      type: object
      required:
      - name
      - address
      title: BillingInfo
    BillingInfoCreateHint:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[\p{L} .'-]+$
          title: Name
        address:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 5
          - type: 'null'
          title: Address
      additionalProperties: false
      type: object
      required:
      - name
      title: BillingInfoCreateHint
      description: Client comparison hint; omitted address is copied from Customer.
    CurrencyCode:
      type: string
      enum:
      - USD
      - VND
      - EUR
      title: CurrencyCode
    CustomerCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[\p{L} .'-]+$
          title: Name
        address:
          type: string
          maxLength: 255
          minLength: 5
          title: Address
        phone:
          type: string
          pattern: ^\+?[1-9]\d{7,14}$
          title: Phone
          description: E.164-compatible number containing 8 to 15 digits.
        bankingDetails:
          $ref: '#/components/schemas/BankingDetails'
        role:
          $ref: '#/components/schemas/Role'
        orderHistory:
          items:
            type: string
            maxLength: 36
            minLength: 36
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
            format: uuid
          type: array
          maxItems: 0
          title: Orderhistory
      additionalProperties: false
      type: object
      required:
      - name
      - address
      - phone
      - bankingDetails
      - role
      title: CustomerCreate
    CustomerResponse:
      properties:
        id:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Id
        name:
          type: string
          maxLength: 100
          minLength: 2
          pattern: ^[\p{L} .'-]+$
          title: Name
        address:
          type: string
          maxLength: 255
          minLength: 5
          title: Address
        phone:
          type: string
          pattern: ^\+?[1-9]\d{7,14}$
          title: Phone
          description: E.164-compatible number containing 8 to 15 digits.
        bankingDetails:
          $ref: '#/components/schemas/BankingDetails'
        role:
          $ref: '#/components/schemas/Role'
        orderHistory:
          items:
            type: string
            maxLength: 36
            minLength: 36
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
            format: uuid
          type: array
          maxItems: 10000
          title: Orderhistory
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - address
      - phone
      - bankingDetails
      - role
      title: CustomerResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvoiceCreate:
      properties:
        orderRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Orderref
        billingInfo:
          anyOf:
          - $ref: '#/components/schemas/BillingInfoCreateHint'
          - type: 'null'
        totalAmount:
          anyOf:
          - type: string
            maximum: 99999999.99
            minimum: 0.01
            pattern: ^\d{1,8}\.\d{2}$
          - type: 'null'
          title: Totalamount
        issueDate:
          anyOf:
          - type: string
            pattern: ^\d{2}/\d{2}/\d{4}$
            description: A real calendar date in dd/MM/yyyy format.
          - type: 'null'
          title: Issuedate
        dueDate:
          anyOf:
          - type: string
            pattern: ^\d{2}/\d{2}/\d{4}$
            description: A real calendar date in dd/MM/yyyy format.
          - type: 'null'
          title: Duedate
        status:
          $ref: '#/components/schemas/InvoiceStatus'
          default: ISSUED
      additionalProperties: false
      type: object
      required:
      - orderRef
      title: InvoiceCreate
    InvoiceResponse:
      properties:
        id:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Id
        orderRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Orderref
        billingInfo:
          $ref: '#/components/schemas/BillingInfo'
        totalAmount:
          type: string
          maximum: 99999999.99
          minimum: 0.01
          pattern: ^\d{1,8}\.\d{2}$
          title: Totalamount
        issueDate:
          type: string
          pattern: ^\d{2}/\d{2}/\d{4}$
          title: Issuedate
          description: A real calendar date in dd/MM/yyyy format.
        dueDate:
          type: string
          pattern: ^\d{2}/\d{2}/\d{4}$
          title: Duedate
          description: A real calendar date in dd/MM/yyyy format.
        status:
          $ref: '#/components/schemas/InvoiceStatus'
      additionalProperties: false
      type: object
      required:
      - id
      - orderRef
      - billingInfo
      - totalAmount
      - issueDate
      - dueDate
      - status
      title: InvoiceResponse
    InvoiceStatus:
      type: string
      enum:
      - ISSUED
      - PAID
      - OVERDUE
      - CANCELLED
      title: InvoiceStatus
    OrderCreate:
      properties:
        customerRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Customerref
        lineItems:
          items:
            $ref: '#/components/schemas/OrderLineItemCreate'
          type: array
          maxItems: 100
          minItems: 1
          title: Lineitems
        totalAmount:
          anyOf:
          - type: string
            maximum: 99999999.99
            minimum: 0.01
            pattern: ^\d{1,8}\.\d{2}$
          - type: 'null'
          title: Totalamount
        status:
          $ref: '#/components/schemas/OrderStatus'
          default: PLACED
      additionalProperties: false
      type: object
      required:
      - customerRef
      - lineItems
      title: OrderCreate
    OrderLineItemCreate:
      properties:
        productRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Productref
        quantity:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Quantity
        unitPriceSnapshot:
          anyOf:
          - type: string
            maximum: 999999.99
            minimum: 0.01
            pattern: ^\d{1,6}\.\d{2}$
          - type: 'null'
          title: Unitpricesnapshot
      additionalProperties: false
      type: object
      required:
      - productRef
      - quantity
      title: OrderLineItemCreate
    OrderLineItemResponse:
      properties:
        productRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Productref
        quantity:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Quantity
        unitPriceSnapshot:
          type: string
          maximum: 999999.99
          minimum: 0.01
          pattern: ^\d{1,6}\.\d{2}$
          title: Unitpricesnapshot
      additionalProperties: false
      type: object
      required:
      - productRef
      - quantity
      - unitPriceSnapshot
      title: OrderLineItemResponse
    OrderResponse:
      properties:
        id:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Id
        customerRef:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          format: uuid
          title: Customerref
        lineItems:
          items:
            $ref: '#/components/schemas/OrderLineItemResponse'
          type: array
          maxItems: 100
          minItems: 1
          title: Lineitems
        totalAmount:
          type: string
          maximum: 99999999.99
          minimum: 0.01
          pattern: ^\d{1,8}\.\d{2}$
          title: Totalamount
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        invoiceRef:
          anyOf:
          - type: string
            maxLength: 36
            minLength: 36
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
            format: uuid
          - type: 'null'
          title: Invoiceref
      additionalProperties: false
      type: object
      required:
      - id
      - customerRef
      - lineItems
      - totalAmount
      - status
      - createdAt
      - updatedAt
      title: OrderResponse
    OrderStatus:
      type: string
      enum:
      - PLACED
      - ACCEPTED
      - INVOICED
      - PAID
      - VERIFIED
      - SHIPPED
      - CLOSED
      - CANCELLED
      title: OrderStatus
    OrderWorkflowResponse:
