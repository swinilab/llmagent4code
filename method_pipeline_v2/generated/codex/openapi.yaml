      operationId: create_customer_api_v1_customers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Malformed identifier or request validation failure
          content: &id001
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type:
                        - string
                        - 'null'
                      details: {}
                required:
                - error
