  /api/v1/invoices:
    post:
      tags:
      - invoices
      summary: Create Invoice
      operationId: create_invoice_api_v1_invoices_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          description: Malformed identifier or request validation failure
          content: *id001
        '409':
          description: The requested workflow transition conflicts with current state
          content: *id001
        '404':
