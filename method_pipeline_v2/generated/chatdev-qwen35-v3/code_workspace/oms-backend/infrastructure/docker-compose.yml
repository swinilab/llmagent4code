# Infrastructure as Code (IaC) - Docker Configuration

## Dockerfile

```dockerfile
FROM python:3.11-slim

WORKDIR /app

# Install uv
RUN pip install uv

# Copy project files
COPY . .

# Install dependencies
RUN uv sync --frozen

# Expose port
EXPOSE 8000

# Run the application
CMD ["uv", "run", "python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
```

## docker-compose.yml

```yaml
version: '3.8'

services:
  oms-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./oms.db:/app/oms.db
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///oms.db
      - RATE_LIMIT_MAX_EVENTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
      - REQUEST_TIMEOUT_SECONDS=30
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Toxiproxy for fault injection testing (NFR verification)
  toxiproxy:
    image: shopify/toxiproxy:latest
    ports:
      - "8474:8474"
    depends_on:
      - oms-backend
    profiles:
      - testing
```

## Production Deployment Notes

### Environment Variables

| Variable | Default | Description |
|----------|---------|-------------|
| DATABASE_URL | sqlite:///oms.db | Database connection string |
| RATE_LIMIT_MAX_EVENTS | 100 | Maximum events per window |
| RATE_LIMIT_WINDOW_SECONDS | 60 | Rate limit window duration |
| REQUEST_TIMEOUT_SECONDS | 30 | Request timeout threshold |

### Volume Mounts

- `./oms.db:/app/oms.db` - Persistent database storage
- `./logs:/app/logs` - Application logs (if logging to file is enabled)

### Health Check

The container includes a health check that queries `/health` endpoint every 30 seconds.

### Scaling Considerations

For production scaling:
1. Replace SQLite with PostgreSQL for concurrent access
2. Use Redis for distributed rate limiting
3. Add load balancer in front of multiple instances
4. Implement proper logging and monitoring (Prometheus, Grafana)

### Security Considerations

For production:
1. Add authentication/authorization middleware
2. Enable HTTPS/TLS termination
3. Implement API rate limiting per client IP
4. Add input sanitization for SQL injection prevention
5. Enable CORS only for trusted origins
