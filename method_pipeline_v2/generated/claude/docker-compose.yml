# Production-shaped local deployment.
#
# Topology (NFR 1.2 Maintain Multiple Copies of Data):
#   postgres-primary  - read/write master
#   postgres-replica  - hot standby, streaming replication, read-only queries
#   redis             - cache + shared token bucket
#   api               - FastAPI, 4 workers behind uvicorn
#
# `docker compose up --build -d` is the whole deployment (see start_command.txt).

name: oms

x-db-env: &db-env
  POSTGRES_USER: oms
  POSTGRES_PASSWORD: oms
  POSTGRES_DB: oms
  REPLICATION_USER: replicator
  REPLICATION_PASSWORD: replicator

services:
  postgres-primary:
    image: postgres:16-alpine
    container_name: oms-postgres-primary
    environment:
      <<: *db-env
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./deploy/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d oms"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [oms-net]

  postgres-replica:
    image: postgres:16-alpine
    container_name: oms-postgres-replica
    user: postgres
    environment:
      <<: *db-env
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres-primary
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./deploy/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d oms"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks: [oms-net]

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [oms-net]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-api
    environment:
      OMS_DATABASE_URL: postgresql+psycopg://oms:oms@postgres-primary:5432/oms
      OMS_DATABASE_REPLICA_URL: postgresql+psycopg://oms:oms@postgres-replica:5432/oms
      OMS_REDIS_URL: redis://redis:6379/0
      OMS_RATE_LIMIT_CAPACITY: "100"
      OMS_RATE_LIMIT_REFILL_PER_SECOND: "50"
      OMS_RESYNC_INTERVAL_SECONDS: "15"
    ports:
      - "8000:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [oms-net]

volumes:
  primary-data:
  replica-data:
  redis-data:

networks:
  oms-net:
    driver: bridge
