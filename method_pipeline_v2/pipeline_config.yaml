# ─────────────────────────────────────────────
#  Empirical Study Pipeline – Configuration
# ─────────────────────────────────────────────

workdir: "."

# ── Generation ────────────────────────────────
agent:
  type: "chatdev"
  model: "qwen3.5:cloud"                      
  api_key: "ok"
  api_base: "https://ollama.com/v1"
  temperature: 0.2
  workflow: "agents/chatdev.yaml"             # ChatDev's coding workflow
  prompt_template: "prompts/latest.md"        # path to the generation prompt
  generated_dir: "generated"

# ── Validation ────────────────────────────────
validation:
  # Stage 1 – Compilability
  docker:
    image: "python:3.11-slim"
    timeout_seconds: 60
    workdir: "/app"

  # Stage 2 – Functional tests (HTTP)
  http:
    base_url: "http://localhost:8000"
    timeout_seconds: 10
    endpoints:                          # list of test cases
      - id: "health_check"
        method: GET
        path: "/health/live"
        expected_status: 200

      - id: "create_item"
        method: GET
        path: "/api/v1/products"
        # body: { "name": "test_item", "value": 42 }
        expected_status: 200

      - id: "get_item"
        method: GET
        path: "/items/1"
        expected_status: 404

      - id: "invalid_item"
        method: GET
        path: "/items/9999"
        expected_status: 404

# ── Repair Loop ───────────────────────────────
repair:
  max_iterations: 5           # k — maximum repair attempts
  type: "mini"
  model: "gpt-oss:120b-cloud"                      
  api_key: "ok"
  api_base: "https://ollama.com/v1"
  temperature: 0.2
  workflow: "agents/mini.yaml"             
  prompt_template: "prompts/simple.md"        # path to the generation prompt
  generated_dir: "generated"

# ── Output ────────────────────────────────────
output:
  report_dir: "reports/"
  generated_code_path: "output/generated_code.py"
  verbose: true
