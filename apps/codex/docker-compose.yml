name: production-oms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oms}
      POSTGRES_USER: ${POSTGRES_USER:-oms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    environment:
      OMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oms}:${POSTGRES_PASSWORD:-oms}@postgres:5432/${POSTGRES_DB:-oms}
      OMS_REDIS_URL: redis://redis:6379/0
      OMS_EVENT_MAX_RATE: ${OMS_EVENT_MAX_RATE:-25}
      OMS_EVENT_BATCH_SIZE: ${OMS_EVENT_BATCH_SIZE:-50}
      OMS_EVENT_POLL_INTERVAL_SECONDS: ${OMS_EVENT_POLL_INTERVAL_SECONDS:-0.25}
      OMS_CACHE_TTL_SECONDS: ${OMS_CACHE_TTL_SECONDS:-300}
      OMS_STATE_SYNC_INTERVAL_SECONDS: ${OMS_STATE_SYNC_INTERVAL_SECONDS:-60}
      OMS_DEPENDENCY_TIMEOUT_SECONDS: ${OMS_DEPENDENCY_TIMEOUT_SECONDS:-1.5}
      OMS_LOG_LEVEL: ${OMS_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
