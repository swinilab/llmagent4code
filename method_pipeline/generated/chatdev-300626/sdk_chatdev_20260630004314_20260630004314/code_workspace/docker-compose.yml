version: '3.8'

services:
  # OMS Backend Service
  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/omsdb
      - SPRING_DATASOURCE_USERNAME=oms
      - SPRING_DATASOURCE_PASSWORD=omspassword
      - JAVA_OPTS=-Xms512m -Xmx2g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - oms-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oms-postgres
    environment:
      - POSTGRES_DB=omsdb
      - POSTGRES_USER=oms
      - POSTGRES_PASSWORD=omspassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d omsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oms-network
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oms-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@chatdev.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - oms-network
    restart: unless-stopped

networks:
  oms-network:
    driver: bridge

volumes:
  postgres-data:
