version: "3.9"

# ── Resource Limits & Derivation ────────────────────────────────────────
# Target hardware: single node, 16 CPU cores, 98 GB RAM
#
# Container allocations (sum = 46 GB, leaving 52 GB for OS + headroom):
#   - App (8 uvicorn workers): 32 GB RAM, 16 CPU cores (pinned)
#     Derivation: 8 workers × 4 GB/worker = 32 GB. Each worker handles
#     ~4096 concurrent connections. 16 cores = full hardware utilization.
#   - PostgreSQL: 8 GB RAM, 4 CPU cores
#     Derivation: DB pool of 40 connections, each ~200 MB working set = 8 GB.
#     4 cores sufficient for 40 concurrent queries.
#   - Redis: 2 GB RAM, 2 CPU cores
#     Derivation: Cache + rate limiter + idempotency state. 2 GB covers
#     ~500k product entries at ~4 KB each.
#   - RabbitMQ: 4 GB RAM, 2 CPU cores
#     Derivation: Queue max 10,000 messages × ~400 KB each = 4 GB.
#
# NOTE: Both `deploy.resources.limits` (Swarm mode) and `mem_limit`/`cpus`
# (non-Swarm docker-compose up) are specified for compatibility.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 8G
    cpus: "4"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    mem_limit: 2G
    cpus: "2"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    mem_limit: 4G
    cpus: "2"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      OMS_DB_URL: "postgresql+asyncpg://oms:oms@postgres:5432/oms"
      OMS_REDIS_URL: "redis://redis:6379/0"
      OMS_RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      OMS_UVICORN_WORKERS: "8"
      OMS_DB_POOL_SIZE: "40"
      OMS_LOG_LEVEL: "INFO"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 32G
    cpus: "16"
    deploy:
      resources:
        limits:
          cpus: "16"
          memory: "32G"

volumes:
  pgdata:
