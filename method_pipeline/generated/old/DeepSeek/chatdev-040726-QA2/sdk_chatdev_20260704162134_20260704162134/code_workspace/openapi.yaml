openapi: "3.1.0"
info:
  title: "OMS - Order Management System"
  version: "1.0.0"
  description: "Production-grade e-commerce Order Management System backend."
servers:
  - url: "http://localhost:8000"
    description: "Local development server"

paths:
  /health:
    get:
      tags: [system]
      summary: "Health check"
      operationId: healthCheck
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/v1/customers:
    post:
      tags: [customers]
      summary: "Register a new customer"
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: "Customer created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    get:
      tags: [customers]
      summary: "List all customers"
      operationId: listCustomers
      responses:
        "200":
          description: "List of customers"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /api/v1/customers/{customer_id}:
    get:
      tags: [customers]
      summary: "Get customer by ID"
      operationId: getCustomer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Customer found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: "Customer not found"

  /api/v1/products:
    post:
      tags: [products]
      summary: "Create a new product"
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: "Product created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    get:
      tags: [products]
      summary: "List all products"
      operationId: listProducts
      responses:
        "200":
          description: "List of products"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /api/v1/products/{product_id}:
    get:
      tags: [products]
      summary: "Get product by ID"
      operationId: getProduct
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Product found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: "Product not found"

  /api/v1/orders:
    post:
      tags: [orders]
      summary: "Place a new order (Step 1)"
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: "Order placed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Invalid request"
    get:
      tags: [orders]
      summary: "List orders"
      operationId: listOrders
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /api/v1/orders/{order_id}:
    get:
      tags: [orders]
      summary: "Get order by ID"
      operationId: getOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Order found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: "Order not found"

  /api/v1/orders/{order_id}/accept:
    patch:
      tags: [orders]
      summary: "Accept order (Step 2)"
      operationId: acceptOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffActionRequest"
      responses:
        "200":
          description: "Order accepted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Invalid state transition"

  /api/v1/orders/{order_id}/ship:
    patch:
      tags: [orders]
      summary: "Ship order (Step 6)"
      operationId: shipOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffActionRequest"
      responses:
        "200":
          description: "Order shipped"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Invalid state transition"

  /api/v1/orders/{order_id}/close:
    patch:
      tags: [orders]
      summary: "Close completed order (Step 7)"
      operationId: closeOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffActionRequest"
      responses:
        "200":
          description: "Order closed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Invalid state transition"

  /api/v1/orders/{order_id}/cancel:
    patch:
      tags: [orders]
      summary: "Cancel an order"
      operationId: cancelOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: "Order cancelled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: "Invalid state transition"

  /api/v1/invoices:
    post:
      tags: [invoices]
      summary: "Create invoice for accepted order (Step 3)"
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: "Invoice created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: "Invalid request"
    get:
      tags: [invoices]
      summary: "List invoices"
      operationId: listInvoices
      parameters:
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of invoices"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /api/v1/invoices/{invoice_id}:
    get:
      tags: [invoices]
      summary: "Get invoice by ID"
      operationId: getInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Invoice found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: "Invoice not found"

  /api/v1/invoices/{invoice_id}/mark-overdue:
    patch:
      tags: [invoices]
      summary: "Mark an invoice as overdue"
      operationId: markInvoiceOverdue
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Invoice marked overdue"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: "Invalid state transition"

  /api/v1/payments:
    post:
      tags: [payments]
      summary: "Make a payment (Step 4)"
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: "Payment created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: "Invalid request"
    get:
      tags: [payments]
      summary: "List payments"
      operationId: listPayments
      parameters:
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of payments"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /api/v1/payments/{payment_id}:
    get:
      tags: [payments]
      summary: "Get payment by ID"
      operationId: getPayment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Payment found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: "Payment not found"

  /api/v1/payments/{payment_id}/verify:
    patch:
      tags: [payments]
      summary: "Verify payment (Step 5)"
      operationId: verifyPayment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountantActionRequest"
      responses:
        "200":
          description: "Payment verified"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: "Invalid state transition"

components:
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country:
          type: string
      required: [street, city, state, zip_code, country]

    BankingDetails:
      type: object
      properties:
        bank_name:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
      required: [bank_name, account_number, routing_number]

    Money:
      type: object
      properties:
        amount:
          type: number
          format: decimal
          minimum: 0
        currency:
          type: string
          enum: [USD, EUR, GBP, JPY]
      required: [amount, currency]

    LineItem:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        product_description:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: "#/components/schemas/Money"
      required: [product_id, product_description, quantity, unit_price]

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        phone:
          type: string
        banking_details:
          $ref: "#/components/schemas/BankingDetails"
        order_history:
          type: array
          items:
            type: string
            format: uuid
        role:
          type: string
          enum: [customer, order_staff, accountant]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, address, phone, banking_details, role, created_at, updated_at]

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        base_price:
          $ref: "#/components/schemas/Money"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, description, base_price, created_at, updated_at]

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        total:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [pending, accepted, invoiced, paid, shipped, completed, cancelled]
        invoice_ref:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, customer_id, line_items, total, status, created_at, updated_at]

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        timestamp:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, verified, failed]
        method:
          type: string
          enum: [credit_card, debit_card, bank_transfer, digital_wallet]
        verified_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, order_id, invoice_id, amount, timestamp, status, method, created_at, updated_at]

    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        billing_address:
          $ref: "#/components/schemas/Address"
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        subtotal:
          $ref: "#/components/schemas/Money"
        tax:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [draft, issued, paid, overdue, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, order_id, customer_id, billing_address, line_items, subtotal, tax, total, issue_date, due_date, status, created_at, updated_at]

    CreateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        phone:
          type: string
        banking_details:
          $ref: "#/components/schemas/BankingDetails"
      required: [name, address, phone, banking_details]

    CreateProductRequest:
      type: object
      properties:
        description:
          type: string
        base_price:
          $ref: "#/components/schemas/Money"
      required: [description, base_price]

    CreateOrderRequest:
      type: object
      properties:
        customer_id:
          type: string
          format: uuid
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
      required: [customer_id, line_items]

    CreateInvoiceRequest:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        billing_address:
          $ref: "#/components/schemas/Address"
        tax:
          $ref: "#/components/schemas/Money"
        due_date:
          type: string
          format: date
      required: [order_id, customer_id, billing_address, due_date]

    CreatePaymentRequest:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        method:
          type: string
          enum: [credit_card, debit_card, bank_transfer, digital_wallet]
      required: [order_id, invoice_id, amount, method]

    StaffActionRequest:
      type: object
      properties:
        staff_id:
          type: string
          format: uuid
      required: [staff_id]

    AccountantActionRequest:
      type: object
      properties:
        accountant_id:
          type: string
          format: uuid
      required: [accountant_id]

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          default: "Cancelled by customer"
