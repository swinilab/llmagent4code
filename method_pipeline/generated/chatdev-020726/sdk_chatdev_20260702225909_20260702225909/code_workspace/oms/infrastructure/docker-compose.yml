# Docker Compose for local development and testing
# Provides complete OMS environment with database

version: '3.8'

services:
  oms-api:
    build:
      context: ../..
      dockerfile: oms/infrastructure/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OMS_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./oms.db
    volumes:
      - oms-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # PostgreSQL service for production-like testing (optional)
  oms-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=oms
      - POSTGRES_PASSWORD=oms_password
      - POSTGRES_DB=oms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres  # Only start with: docker-compose --profile postgres up

volumes:
  oms-data:
    driver: local
  postgres-data:
    driver: local

networks:
  default:
    name: oms-network
