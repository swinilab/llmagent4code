services:
  oms:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OMS_DATABASE_URL=sqlite+aiosqlite:///./data/oms.db
      - OMS_DEBUG=false
      - OMS_QUEUE_MAX_SIZE=500
      - OMS_QUEUE_WORKER_COUNT=4
      - OMS_DEGRADATION_CPU_THRESHOLD=85.0
      - OMS_DEGRADATION_MEMORY_THRESHOLD=85.0
    volumes:
      # Persist the SQLite database across container restarts
      - oms-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oms-data: