[project]
name = "oms"
version = "1.0.0"
description = "Order Management System - Production-grade e-commerce backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
oms = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
