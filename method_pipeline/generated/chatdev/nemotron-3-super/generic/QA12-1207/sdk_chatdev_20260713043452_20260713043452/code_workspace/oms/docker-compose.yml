version: '3.8'

services:
  db:
    image: postgres:13
    container_name: oms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oms
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: oms_app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oms
    depends_on:
      - db
    volumes:
      - ./oms:/app  # For live code changes during development

volumes:
  postgres_data: