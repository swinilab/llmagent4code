version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: oms_postgres
    environment:
      POSTGRES_USER: oms_user
      POSTGRES_PASSWORD: oms_password
      POSTGRES_DB: oms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: oms_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: oms_app
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://oms_user:oms_password@postgres:5432/oms_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: