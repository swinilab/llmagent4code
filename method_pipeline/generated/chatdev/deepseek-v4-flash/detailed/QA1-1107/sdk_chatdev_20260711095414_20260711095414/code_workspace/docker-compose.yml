"""
Docker Compose for local OMS deployment.
Resource limits reflect target hardware: 8 CPU cores, 98 GB RAM.
Container limits: 4 CPU, 4 GB RAM per service (app, db, cache, broker).
"""
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      POSTGRES_DB: oms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      OMS_DB_URL: "postgresql+asyncpg://oms:oms@postgres:5432/oms"
      OMS_REDIS_URL: "redis://redis:6379/0"
      OMS_RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      OMS_HOST: "0.0.0.0"
      OMS_PORT: "8000"
      OMS_WORKERS: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "4G"
    # Resource derivation:
    #   Target machine: 8 cores, 98 GB RAM
    #   App container:  4 cores (50%), 4 GB RAM (4%)
    #   DB:             2 cores, 2 GB RAM
    #   Cache:          1 core,  1 GB RAM
    #   Broker:         1 core,  1 GB RAM
    #   Total:          8 cores, 8 GB RAM — well within target

volumes:
  pgdata:
