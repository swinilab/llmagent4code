# ─────────────────────────────────────────────────────────────────────────────
# Order Management System — Docker Compose
# Single-node deployment with PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: oms-postgres
    environment:
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms_secret
      POSTGRES_DB: oms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d oms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1g"
    networks:
      - oms-network

  oms-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: oms-api
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: oms
      DB_PASSWORD: oms_secret
      DB_NAME: oms_db
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - oms-network

volumes:
  postgres_data:
    driver: local

networks:
  oms-network:
    driver: bridge
