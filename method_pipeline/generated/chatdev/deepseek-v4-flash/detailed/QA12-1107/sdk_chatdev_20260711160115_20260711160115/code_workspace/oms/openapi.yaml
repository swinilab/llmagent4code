# OpenAPI 3.0 specification for the OMS API.
# This is auto-generated by FastAPI at /openapi.json, but provided here
# as a versioned reference document.
openapi: "3.0.3"
info:
  title: "Order Management System (OMS)"
  version: "1.0.0"
  description: "Production-grade e-commerce Order Management System backend."
servers:
  - url: "http://localhost:8000"
    description: "Local development"
paths:
  /api/v1/customers:
    post:
      summary: "Create a new customer"
      tags: ["Customers"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: "Customer created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
    get:
      summary: "List all customers"
      tags: ["Customers"]
      responses:
        "200":
          description: "List of customers"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponse"
  /api/v1/products:
    post:
      summary: "Create a new product"
      tags: ["Products"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: "Product created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
    get:
      summary: "List or search products"
      tags: ["Products"]
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: "Search query"
      responses:
        "200":
          description: "List of products"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
  /api/v1/orders:
    post:
      summary: "Create a new order (Step 1)"
      tags: ["Orders"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: "Order created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
    get:
      summary: "List orders"
      tags: ["Orders"]
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
          description: "Filter by customer ID"
      responses:
        "200":
          description: "List of orders"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
  /api/v1/orders/{order_id}:
    get:
      summary: "Get order by ID"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Order details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /api/v1/orders/{order_id}/accept:
    post:
      summary: "Accept order (Step 2) - Requires ORDER_STAFF or ACCOUNTANT"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          schema:
            type: string
            default: "CUSTOMER"
          description: "User role for authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAction"
      responses:
        "200":
          description: "Order accepted"
  /api/v1/orders/{order_id}/invoice:
    post:
      summary: "Invoice order (Step 3) - Requires ACCOUNTANT"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          schema:
            type: string
            default: "CUSTOMER"
          description: "User role for authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequest"
      responses:
        "200":
          description: "Invoice created"
  /api/v1/orders/{order_id}/pay:
    post:
      summary: "Pay order (Step 4)"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "200":
          description: "Payment processed"
  /api/v1/orders/{order_id}/payment:
    get:
      summary: "Verify payment (Step 5)"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Payment details"
  /api/v1/orders/{order_id}/ship:
    post:
      summary: "Ship order (Step 6) - Requires ORDER_STAFF"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          schema:
            type: string
            default: "CUSTOMER"
          description: "User role for authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAction"
      responses:
        "200":
          description: "Order shipped"
  /api/v1/orders/{order_id}/close:
    post:
      summary: "Close order (Step 7) - Requires ORDER_STAFF"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          schema:
            type: string
            default: "CUSTOMER"
          description: "User role for authorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAction"
      responses:
        "200":
          description: "Order closed"
  /api/v1/orders/{order_id}/cancel:
    post:
      summary: "Cancel order"
      tags: ["Orders"]
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderAction"
      responses:
        "200":
          description: "Order cancelled"
  /api/v1/recommendations/{customer_id}:
    get:
      summary: "Get personalized recommendations (non-essential)"
      tags: ["Recommendations"]
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Recommendations list"
  /health:
    get:
      summary: "Full health check"
      tags: ["Health"]
      responses:
        "200":
          description: "Health status"
  /health/ready:
    get:
      summary: "Readiness probe"
      tags: ["Health"]
      responses:
        "200":
          description: "Ready status"
  /health/live:
    get:
      summary: "Liveness probe"
      tags: ["Health"]
      responses:
        "200":
          description: "Alive status"
  /metrics:
    get:
      summary: "Internal metrics"
      tags: ["Monitoring"]
      responses:
        "200":
          description: "Metrics data"
components:
  schemas:
    CustomerCreate:
      type: object
      required: [name, address, phone, banking_details]
      properties:
        name: {type: string}
        address: {type: string}
        phone: {type: string}
        banking_details: {type: string}
        role: {type: string, default: "CUSTOMER"}
    CustomerResponse:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        address: {type: string}
        phone: {type: string}
        banking_details: {type: string}
        role: {type: string}
        created_at: {type: string, format: date-time}
    ProductCreate:
      type: object
      required: [name, base_price]
      properties:
        name: {type: string}
        description: {type: string}
        base_price: {type: number}
        currency: {type: string, default: "USD"}
        stock_available: {type: integer, default: 0}
    ProductResponse:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        base_price: {type: string}
        currency: {type: string}
        stock_available: {type: integer}
    OrderCreate:
      type: object
      required: [customer_id, line_items]
      properties:
        customer_id: {type: string}
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemRequest"
    LineItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: {type: string}
        quantity: {type: integer, minimum: 1}
    OrderResponse:
      type: object
      properties:
        id: {type: string}
        customer_id: {type: string}
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemResponse"
        total_amount: {type: string}
        currency: {type: string}
        status: {type: string}
        invoice_ref: {type: string, nullable: true}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        accepted_at: {type: string, format: date-time, nullable: true}
        invoiced_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
        shipped_at: {type: string, format: date-time, nullable: true}
        closed_at: {type: string, format: date-time, nullable: true}
        cancelled_at: {type: string, format: date-time, nullable: true}
    LineItemResponse:
      type: object
      properties:
        product_id: {type: string}
        product_name: {type: string}
        quantity: {type: integer}
        unit_price: {type: string}
        currency: {type: string}
    OrderAction:
      type: object
      required: [version]
      properties:
        version: {type: integer, minimum: 1}
    InvoiceRequest:
      type: object
      required: [version, billing_address]
      properties:
        version: {type: integer, minimum: 1}
        billing_address: {type: string}
    PaymentRequest:
      type: object
      required: [amount, idempotency_key]
      properties:
        amount: {type: number}
        method: {type: string, default: "CREDIT_CARD"}
        idempotency_key: {type: string}
    InvoiceResponse:
      type: object
      properties:
        invoice_id: {type: string}
        order_id: {type: string}
        total: {type: string}
    PaymentResponse:
      type: object
      properties:
        payment_id: {type: string}
        order_id: {type: string}
        status: {type: string}
        idempotent: {type: boolean}
    VerifyPaymentResponse:
      type: object
      properties:
        payment_id: {type: string}
        order_id: {type: string}
        status: {type: string}
        amount: {type: string}
        completed_at: {type: string, nullable: true}
