components:
  schemas:
    CustomerCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        banking_details:
          $ref: "#/components/schemas/BankingDetails"
    CustomerUpdateRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
    ProductCreateRequest:
      type: object
      required: [name, price_amount]
      properties:
        name:
          type: string
        description:
          type: string
        price_amount:
          type: number
        price_currency:
          type: string
          default: "USD"
        stock:
          type: integer
          default: 0
    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price_amount:
          type: number
        price_currency:
          type: string
        stock:
          type: integer
        available:
          type: boolean
    OrderCreateRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemRequest"
        shipping_address:
          $ref: "#/components/schemas/Address"
        notes:
          type: string
    OrderPayRequest:
      type: object
      required: [amount, method]
      properties:
        amount:
          type: number
        currency:
          type: string
          default: "USD"
        method:
          type: string
          default: "CREDIT_CARD"
    LineItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country:
          type: string
    BankingDetails:
      type: object
      properties:
        account_holder:
          type: string
        account_number:
          type: string
        routing_number:
          type: string
        bank_name:
          type: string
