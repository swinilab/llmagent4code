openapi: "3.1.0"
info:
  title: OMS Backend
  version: "1.0.0"
  description: Production-grade Order Management System backend.
servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /health:
    get:
      tags: [Infrastructure]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/customers:
    post:
      tags: [Customers]
      summary: Register a new customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
    get:
      tags: [Customers]
      summary: List all customers
      operationId: listCustomers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerResponse"

  /api/v1/customers/{customer_id}:
    get:
      tags: [Customers]
      summary: Get customer by ID
      operationId: getCustomer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Not found

  /api/v1/products:
    post:
      tags: [Products]
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
    get:
      tags: [Products]
      summary: List all products
      operationId: listProducts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"

  /api/v1/products/{product_id}:
    get:
      tags: [Products]
      summary: Get product by ID
      operationId: getProduct
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Not found

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Place an order (Step 1)
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
    get:
      tags: [Orders]
      summary: List orders, optionally filtered by status
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"

  /api/v1/orders/{order_id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      operationId: getOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Not found

  /api/v1/orders/{order_id}/accept:
    patch:
      tags: [Orders]
      summary: Accept a pending order (Step 2)
      operationId: acceptOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid state transition
        "404":
          description: Not found

  /api/v1/orders/{order_id}/invoice:
    post:
      tags: [Orders]
      summary: Create invoice for accepted order (Step 3)
      operationId: createInvoice
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreate"
      responses:
        "200":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

  /api/v1/orders/{order_id}/payments:
    post:
      tags: [Orders]
      summary: Record a payment (Step 4)
      operationId: recordPayment
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreate"
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

  /api/v1/orders/payments/{payment_id}/verify:
    post:
      tags: [Orders]
      summary: Verify a payment (Step 5)
      operationId: verifyPayment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerification"
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

  /api/v1/orders/{order_id}/ship:
    patch:
      tags: [Orders]
      summary: Ship a paid order (Step 6)
      operationId: shipOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Shipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

  /api/v1/orders/{order_id}/close:
    patch:
      tags: [Orders]
      summary: Close a shipped order (Step 7)
      operationId: closeOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

  /api/v1/orders/{order_id}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel a pending or accepted order
      operationId: cancelOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Invalid state
        "404":
          description: Not found

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
        circuit_breakers:
          type: object
          additionalProperties:
            type: string
        version:
          type: string

    CustomerCreate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        banking_details: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    CustomerResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        banking_details: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    ProductCreate:
      type: object
      properties:
        description: { type: string }
        base_price: { type: number, format: decimal }
        currency: { type: string }

    ProductResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        description: { type: string }
        base_price: { type: number }
        currency: { type: string }

    OrderCreate:
      type: object
      required: [customer_id, line_items]
      properties:
        customer_id: { type: string, format: uuid }
        line_items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineItemRequest"

    LineItemRequest:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unit_price: { type: number, format: decimal }
        currency: { type: string, default: "USD" }

    OrderResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        invoice_id: { type: string, format: uuid, nullable: true }
        payment_id: { type: string, format: uuid, nullable: true }
        total_amount: { type: number }
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemResponse"

    LineItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer }
        unit_price: { type: number }
        currency: { type: string }
        total: { type: number }

    PaymentCreate:
      type: object
      required: [amount]
      properties:
        amount: { type: number, format: decimal }
        currency: { type: string, default: "USD" }
        method: { $ref: "#/components/schemas/PaymentMethod" }

    PaymentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { type: number }
        currency: { type: string }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        timestamp: { type: string, format: date-time }

    PaymentVerification:
      type: object
      properties:
        verified: { type: boolean, default: true }

    InvoiceCreate:
      type: object
      properties:
        billing_name: { type: string }
        billing_address: { type: string }
        due_days: { type: integer, default: 30 }

    InvoiceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        billing_name: { type: string }
        billing_address: { type: string }
        total_amount: { type: number }
        currency: { type: string }
        issue_date: { type: string, format: date-time }
        due_date: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/InvoiceStatus" }

    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, INVOICED, PAID, SHIPPED, CLOSED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [PENDING, VERIFIED, FAILED, REFUNDED]

    InvoiceStatus:
      type: string
      enum: [DRAFT, ISSUED, PAID, OVERDUE, CANCELLED]

    PaymentMethod:
      type: string
      enum: [CREDIT_CARD, BANK_TRANSFER, PAYPAL, CASH]

    UserRole:
      type: string
      enum: [CUSTOMER, ORDER_STAFF, ACCOUNTANT]
