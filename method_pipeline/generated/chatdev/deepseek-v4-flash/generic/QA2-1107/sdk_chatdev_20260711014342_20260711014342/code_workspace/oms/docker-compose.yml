services:
  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OMS_DATABASE_URL: "sqlite:///./data/oms.db"
      OMS_DEBUG: "false"
      OMS_HOST: "0.0.0.0"
      OMS_PORT: "8000"
    volumes:
      - oms_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  oms_data:
