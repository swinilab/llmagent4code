openapi: 3.0.3
info:
  title: Order Management System API
  description: |
    A production-grade Order Management System backend implementing the complete order workflow.
    
    ## Workflow Steps
    1. Customer places order
    2. Order Staff reviews & accepts
    3. Accountant creates invoice
    4. Customer pays invoice
    5. Accountant verifies payment
    6. Order Staff ships paid order
    7. Order Staff closes completed order
    
    ## NFR Support
    - NFR 2.1 Graceful Degradation: Feature flags and circuit breakers
    - NFR 2.2 Fault Detection: Health checks and automatic recovery
    - NFR 2.3 State Preservation: WAL mode, snapshots, and idempotency keys
  version: 1.0.0
  contact:
    name: OMS Backend Team
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /api/v1/customers:
    get:
      tags: [customers]
      summary: List customers
      parameters:
        - name: skip
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, default: 100}
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags: [customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
  /api/v1/customers/{customer_id}:
    get:
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    patch:
      tags: [customers]
      summary: Update customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated
    delete:
      tags: [customers]
      summary: Delete customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204':
          description: Customer deleted
  /api/v1/products:
    get:
      tags: [products]
      summary: List products
      parameters:
        - name: skip
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, default: 100}
        - name: active_only
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: List of products
    post:
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
  /api/v1/products/{product_id}:
    get:
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Product found
  /api/v1/orders:
    get:
      tags: [orders]
      summary: List orders
      parameters:
        - name: skip
          in: query
          schema: {type: integer, default: 0}
        - name: limit
          in: query
          schema: {type: integer, default: 100}
        - name: status
          in: query
          schema: {type: string}
        - name: customer_id
          in: query
          schema: {type: string}
      responses:
        '200':
          description: List of orders
    post:
      tags: [orders]
      summary: Place order (Step 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed
  /api/v1/orders/{order_id}:
    get:
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Order found
  /api/v1/orders/{order_id}/accept:
    patch:
      tags: [orders]
      summary: Accept order (Step 2)
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Order accepted
  /api/v1/orders/{order_id}/ship:
    patch:
      tags: [orders]
      summary: Ship order (Step 6)
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
        - name: tracking_number
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Order shipped
  /api/v1/orders/{order_id}/close:
    patch:
      tags: [orders]
      summary: Close order (Step 7)
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Order closed
  /api/v1/invoices:
    post:
      tags: [invoices]
      summary: Create invoice (Step 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created
  /api/v1/invoices/{invoice_id}:
    get:
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Invoice found
  /api/v1/payments:
    post:
      tags: [payments]
      summary: Create payment (Step 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
  /api/v1/payments/{payment_id}/process:
    post:
      tags: [payments]
      summary: Process payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Payment processed
  /api/v1/payments/{payment_id}/verify:
    post:
      tags: [payments]
      summary: Verify payment (Step 5)
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Payment verified
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: System health status
  /api/v1/health/nfr-verification:
    get:
      tags: [health]
      summary: NFR verification
      description: Verify NFR compliance
      responses:
        '200':
          description: NFR verification results
components:
  schemas:
    Customer:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        address: {$ref: '#/components/schemas/Address'}
        role: {type: string}
        created_at: {type: string}
        updated_at: {type: string}
    Address:
      type: object
      properties:
        street: {type: string}
        city: {type: string}
        state: {type: string}
        postal_code: {type: string}
        country: {type: string}
    CreateCustomerRequest:
      type: object
      required: [name, email]
      properties:
        name: {type: string}
        email: {type: string}
        phone: {type: string}
        address: {$ref: '#/components/schemas/Address'}
    UpdateCustomerRequest:
      type: object
      properties:
        name: {type: string}
        email: {type: string}
        phone: {type: string}
    Product:
      type: object
      properties:
        id: {type: string}
        sku: {type: string}
        description: {type: string}
        base_price: {type: number}
        currency: {type: string}
        stock_quantity: {type: integer}
        is_active: {type: boolean}
    CreateProductRequest:
      type: object
      required: [sku, base_price]
      properties:
        sku: {type: string}
        description: {type: string}
        base_price: {type: number}
        currency: {type: string, default: USD}
        stock_quantity: {type: integer, default: 0}
    Order:
      type: object
      properties:
        id: {type: string}
        customer_id: {type: string}
        line_items: {type: array}
        status: {type: string}
        subtotal: {type: number}
        tax: {type: number}
        shipping: {type: number}
        total: {type: number}
        currency: {type: string}
        invoice_id: {type: string}
        created_at: {type: string}
    PlaceOrderRequest:
      type: object
      required: [customer_id, line_items, shipping_address]
      properties:
        customer_id: {type: string}
        line_items: {type: array}
        shipping_address: {$ref: '#/components/schemas/Address'}
        notes: {type: string}
        idempotency_key: {type: string}
    Invoice:
      type: object
      properties:
        id: {type: string}
        order_id: {type: string}
        customer_id: {type: string}
        subtotal: {type: number}
        tax: {type: number}
        total: {type: number}
        currency: {type: string}
        status: {type: string}
        issue_date: {type: string}
        due_date: {type: string}
    CreateInvoiceRequest:
      type: object
      required: [order_id, customer_id, billing_address]
      properties:
        order_id: {type: string}
        customer_id: {type: string}
        billing_address: {$ref: '#/components/schemas/Address'}
        due_date_days: {type: integer, default: 30}
    Payment:
      type: object
      properties:
        id: {type: string}
        order_id: {type: string}
        invoice_id: {type: string}
        amount: {type: number}
        currency: {type: string}
        status: {type: string}
        transaction_ref: {type: string}
    CreatePaymentRequest:
      type: object
      required: [order_id, invoice_id, customer_id, amount]
      properties:
        order_id: {type: string}
        invoice_id: {type: string}
        customer_id: {type: string}
        amount: {type: number}
        method: {type: string, default: bank_transfer}
        idempotency_key: {type: string}
