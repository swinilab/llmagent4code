# OMS Backend — Configuration
# All settings are environment-agnostic; override via environment variables.

database:
  host: "10.60.190.97"
  port: 5432
  username: "postgres"
  password: "postgres123"
  name: "oms_db"
  min_pool_size: 20
  max_pool_size: 100
  pool_timeout: 30

redis:
  host: "10.60.190.97"
  port: 6379
  db: 0
  password: ""

app:
  host: "0.0.0.0"
  port: 8000
  workers: 4  # will be overridden by gunicorn; 2*CPU+1
  debug: false
  log_level: "info"
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"

rate_limiting:
  enabled: true
  per_customer_rpm: 100
  global_rpm: 10000
  burst: 200

cache:
  product_ttl_seconds: 300
  order_ttl_seconds: 60

queue:
  redis_url: "redis://10.60.190.97:6379/1"
  max_jobs: 1000
  job_timeout_seconds: 60
  retry_attempts: 3
  retry_delay_seconds: 5

payment_gateway:
  enabled: true
  api_key: "sk_test_placeholder"
  api_secret: "placeholder_secret"
  callback_url: "http://localhost:8000/api/v1/payments/webhook"
  timeout_seconds: 30
  circuit_breaker_threshold: 5
  circuit_breaker_timeout_seconds: 30

tax:
  default_rate: "0.0825"  # 8.25% default sales tax
