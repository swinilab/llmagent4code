version: "3.9"

services:
  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: oms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: oms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis 7 (cache + queue) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── OMS Backend (Gunicorn + Uvicorn workers) ───────────────────────────────
  oms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms_backend
    ports:
      - "8000:8000"
    environment:
      OMS_CONFIG: /app/config.yaml
      OMS_BIND: "0.0.0.0:8000"
      OMS_LOG_LEVEL: "info"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Arq Background Worker ─────────────────────────────────────────────────
  oms-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms_worker
    command: python -m infra.worker
    environment:
      OMS_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
