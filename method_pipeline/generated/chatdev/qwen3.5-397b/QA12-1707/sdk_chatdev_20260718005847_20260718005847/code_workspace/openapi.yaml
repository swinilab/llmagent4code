openapi: 3.0.3
info:
  title: Order Management System (OMS)
  description: Production-grade e-commerce order management backend
  version: 1.0.0
  contact:
    name: ChatDev
    email: support@chatdev.com

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: health
    description: Health and readiness checks
  - name: customers
    description: Customer management operations
  - name: products
    description: Product catalog operations
  - name: orders
    description: Order lifecycle management
  - name: invoices
    description: Invoice creation and management
  - name: payments
    description: Payment processing and verification

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check endpoint
      description: Returns system status and database connectivity
      operationId: health_check
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                  database:
                    type: string
                    enum: [connected, disconnected]
                  timestamp:
                    type: number

  /ready:
    get:
      tags:
        - health
      summary: Readiness check
      description: Readiness check for load balancers
      operationId: readiness_check
      responses:
        '200':
          description: System is ready
        '503':
          description: System is not ready

  /api/v1/customers:
    get:
      tags:
        - customers
      summary: List all customers
      operationId: list_customers
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
    post:
      tags:
        - customers
      summary: Create a new customer
      operationId: create_customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

  /api/v1/customers/{customer_id}:
    get:
      tags:
        - customers
      summary: Get customer by ID
      operationId: get_customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
    put:
      tags:
        - customers
      summary: Update customer
      operationId: update_customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer updated
        '404':
          description: Customer not found
    delete:
      tags:
        - customers
      summary: Delete customer
      operationId: delete_customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Customer deleted
        '404':
          description: Customer not found

  /api/v1/products:
    get:
      tags:
        - products
      summary: List all products
      operationId: list_products
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags:
        - products
      summary: Create a new product
      operationId: create_product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created

  /api/v1/orders:
    get:
      tags:
        - orders
      summary: List all orders
      operationId: list_orders
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: customer_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
    post:
      tags:
        - orders
      summary: Create a new order (Customer workflow step 1)
      operationId: create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created
        '400':
          description: Validation error

  /api/v1/orders/{order_id}/review:
    post:
      tags:
        - orders
      summary: Review and accept/reject order (Order Staff workflow step 2)
      operationId: review_order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReviewRequest'
      responses:
        '200':
          description: Order reviewed
        '400':
          description: Invalid state

  /api/v1/orders/{order_id}/ship:
    post:
      tags:
        - orders
      summary: Ship order (Order Staff workflow step 6)
      operationId: ship_order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderShipRequest'
      responses:
        '200':
          description: Order shipped
        '400':
          description: Invalid state

  /api/v1/orders/{order_id}/complete:
    post:
      tags:
        - orders
      summary: Complete order (Order Staff workflow step 7)
      operationId: complete_order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderShipRequest'
      responses:
        '200':
          description: Order completed
        '400':
          description: Invalid state

  /api/v1/invoices:
    get:
      tags:
        - invoices
      summary: List all invoices
      operationId: list_invoices
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
    post:
      tags:
        - invoices
      summary: Create invoice for accepted order (Accountant workflow step 3)
      operationId: create_invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreate'
      responses:
        '201':
          description: Invoice created
        '400':
          description: Order not in ACCEPTED status

  /api/v1/payments:
    get:
      tags:
        - payments
      summary: List all payments
      operationId: list_payments
      parameters:
        - name: skip
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
    post:
      tags:
        - payments
      summary: Create payment for order (Customer workflow step 4)
      operationId: create_payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: Payment created
        '400':
          description: Order not ready for payment

  /api/v1/payments/{payment_id}/verify:
    post:
      tags:
        - payments
      summary: Verify payment (Accountant workflow step 5)
      operationId: verify_payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentVerifyRequest'
      responses:
        '200':
          description: Payment verified
        '404':
          description: Payment not found

components:
  schemas:
    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        banking_details:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 50
        address:
          type: string
        banking_details:
          type: string

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        banking_details:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required:
        - name
        - base_price
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        base_price:
          type: number
          format: float
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        stock_quantity:
          type: integer
          minimum: 0
          default: 0

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        base_price:
          type: number
          format: float
        currency:
          type: string
        stock_quantity:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum:
        - pending
        - reviewing
        - accepted
        - rejected
        - invoiced
        - payment_pending
        - paid
        - shipping
        - shipped
        - completed
        - cancelled

    OrderLineItemCreate:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1

    OrderCreate:
      type: object
      required:
        - customer_id
        - line_items
      properties:
        customer_id:
          type: integer
          minimum: 1
        line_items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLineItemCreate'
        notes:
          type: string

    OrderReviewRequest:
      type: object
      required:
        - accept
      properties:
        accept:
          type: boolean
        notes:
          type: string

    OrderShipRequest:
      type: object
      properties:
        notes:
          type: string

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
        customer_id:
          type: integer
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: number
          format: float
        currency:
          type: string
        invoice_id:
          type: integer
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
        shipped_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineItemResponse'

    OrderLineItemResponse:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        subtotal:
          type: number
          format: float

    InvoiceStatus:
      type: string
      enum:
        - draft
        - issued
        - paid
        - overdue
        - cancelled

    InvoiceCreate:
      type: object
      required:
        - order_id
        - billing_name
      properties:
        order_id:
          type: integer
          minimum: 1
        billing_name:
          type: string
          maxLength: 255
        billing_address:
          type: string
        tax_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0
        notes:
          type: string
        due_days:
          type: integer
          minimum: 1
          default: 30

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        billing_name:
          type: string
        billing_address:
          type: string
        subtotal:
          type: number
          format: float
        tax_amount:
          type: number
          format: float
        total_amount:
          type: number
          format: float
        currency:
          type: string
        issue_date:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentStatus:
      type: string
      enum:
        - pending
        - processing
        - completed
        - failed
        - refunded

    PaymentMethod:
      type: string
      enum:
        - credit_card
        - debit_card
        - bank_transfer
        - cash
        - other

    PaymentCreate:
      type: object
      required:
        - order_id
        - amount
      properties:
        order_id:
          type: integer
          minimum: 1
        amount:
          type: number
          format: float
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
        method:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string

    PaymentVerifyRequest:
      type: object
      required:
        - confirmed
      properties:
        confirmed:
          type: boolean
        notes:
          type: string

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        invoice_id:
          type: integer
        amount:
          type: number
          format: float
        currency:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transaction_id:
          type: string
        notes:
          type: string
        processed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
