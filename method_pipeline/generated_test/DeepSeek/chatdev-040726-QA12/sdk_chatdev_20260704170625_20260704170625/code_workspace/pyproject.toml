[project]
name = "oms-backend"
version = "1.0.0"
description = "Production-grade e-commerce Order Management System backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "sqlmodel",
    "python-dateutil",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
